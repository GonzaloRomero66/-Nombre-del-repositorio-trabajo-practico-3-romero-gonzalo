<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simpsons API</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header class="bg-warning text-center text-white p-2">
      <h1 class="fw-bold">Los Simpsons</h1>
      <h2 class="text-decoration-underline">
        Instituto Politécnico Formosa --- Romero Gonzalo William <br />
        Trabajo Práctico Integrador N°3 Taller de lenguaje de programacion
      </h2>
    </header>
    <main class="container">
      <section class="search-section mb-4">
        <form id="formBuscar" class="search-form">
          <label for="buscarPj"></label>
          <div class="input-group">
            <input
              type="search"
              id="buscarPj"
              class="form-control"
              placeholder="Pon el nombre de personaje"
            />
          </div>
          <button
            type="submit"
            id="btnLimpiar"
            class="btn btn-outline-secondary"
          >
            <img src="assets/css/img/limpiador.webp" alt="apu" width="50px" />
            Limpiar
          </button>
        </form>
      </section>

      <div id="mensajeEstado" class="mb-3"></div>

      <div class="row g-3" id="cartaPj"></div>
      <div class="modal fade" id="modalDetalle" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="modalNombre"></h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body text-center">
              <img
                id="modalImagen"
                src=""
                alt=""
                class="img-fluid mb-3"
                style="max-height: 250px"
              />
              <p><strong>Edad:</strong> <span id="modalEdad"></span></p>
              <p>
                <strong>Fecha de nacimiento:</strong>
                <span id="modalNacimiento"></span>
              </p>
              <p><strong>Género:</strong> <span id="modalGenero"></span></p>
              <p>
                <strong>Ocupación:</strong> <span id="modalOcupacion"></span>
              </p>
              <p><strong>Estado:</strong> <span id="modalEstado"></span></p>
              <p><em id="modalFrase"></em></p>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer
      class="bg-warning footer mt-auto text-black fw-bold text-center text-muted p-1"
    >
      <p>
        &copy;Romero Gonzalo William <br />
        Instituto Politécnico Formosa
      </p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
